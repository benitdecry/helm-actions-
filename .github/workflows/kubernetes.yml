```yaml
name: Test Kubernetes Connection

on:
  push:
    branches:
      - main

jobs:
  test-kubernetes:
    runs-on: self-hosted

    steps:
      - name: Check kubectl
        run: kubectl version --client

      - name: Check Kubernetes nodes
        run: kubectl get nodes

      - name: Check Kubernetes pods
        run: kubectl get pods -A

      - name: Check Helm
        run: helm version
```
